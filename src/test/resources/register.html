<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration - Password Validation</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
  label { display: block; margin-top: 14px; font-weight: bold; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  .msg { min-height: 18px; font-size: 13px; margin-top: 4px; }
  .error { color: #c62828; }
  #strengthLabel { font-weight: bold; }
  #successMsg { color: #2e7d32; font-weight: bold; margin-top: 16px; min-height: 20px; }
  button { margin-top: 18px; padding: 10px 20px; }
</style>
</head>
<body>
<h2>Student Registration</h2>

<label for="username">Username</label>
<input type="text" id="username" name="username">
<div id="usernameError" class="msg error"></div>

<label for="password">Password</label>
<input type="password" id="password" name="password">
<div class="msg">Strength: <span id="strengthLabel"></span></div>
<div id="passwordError" class="msg error"></div>

<label for="confirmPassword">Confirm Password</label>
<input type="password" id="confirmPassword" name="confirmPassword">
<div id="confirmError" class="msg error"></div>

<button type="button" id="registerBtn">Register</button>
<div id="successMsg"></div>

<script>
  // Strength rules:
  //  - length < 8                      -> Weak
  //  - 8+ chars, only 1 character type -> Weak
  //  - 8+ chars, 2 or 3 character types -> Medium
  //  - 8+ chars, all 4 character types  -> Strong
  // Character types: lowercase, uppercase, digit, special (non-alphanumeric)
  function getStrength(p) {
    if (p.length === 0) return "";
    if (p.length < 8) return "Weak";
    var types = 0;
    if (/[a-z]/.test(p)) types++;
    if (/[A-Z]/.test(p)) types++;
    if (/[0-9]/.test(p)) types++;
    if (/[^A-Za-z0-9]/.test(p)) types++;
    if (types <= 1) return "Weak";
    if (types === 4) return "Strong";
    return "Medium";
  }

  var $ = function (id) { return document.getElementById(id); };

  function updateStrength() {
    $("strengthLabel").textContent = getStrength($("password").value);
  }

  function updateMismatch() {
    var p = $("password").value, c = $("confirmPassword").value;
    $("confirmError").textContent =
      (c.length > 0 && p !== c) ? "Passwords do not match" : "";
  }

  $("password").addEventListener("input", function () { updateStrength(); updateMismatch(); });
  $("confirmPassword").addEventListener("input", updateMismatch);

  $("registerBtn").addEventListener("click", function () {
    var u = $("username").value, p = $("password").value, c = $("confirmPassword").value;
    var ok = true;
    $("usernameError").textContent = "";
    $("passwordError").textContent = "";
    $("confirmError").textContent = "";
    $("successMsg").textContent = "";

    if (u.trim() === "") { $("usernameError").textContent = "Username is required"; ok = false; }

    if (p === "") { $("passwordError").textContent = "Password is required"; ok = false; }
    else if (/\s/.test(p)) { $("passwordError").textContent = "Password must not contain spaces"; ok = false; }
    else if (getStrength(p) === "Weak") { $("passwordError").textContent = "Password is too weak"; ok = false; }

    if (c === "") { $("confirmError").textContent = "Confirm password is required"; ok = false; }
    else if (p !== c) { $("confirmError").textContent = "Passwords do not match"; ok = false; }

    if (ok) { $("successMsg").textContent = "Registration successful"; }
  });
</script>
</body>
</html>
